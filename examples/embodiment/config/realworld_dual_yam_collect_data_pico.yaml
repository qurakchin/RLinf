# Standalone recipe: all station-specific addresses are environment variables.
defaults:
  - env/realworld_dual_yam_joint@env.eval
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: yam
      placement: 0
  node_groups:
    - label: yam
      node_ranks: 0
      hardware:
        type: DualYam
        configs:
          - node_rank: 0
            left_follower:
              ee_mass: null
              channel: ${oc.env:YAM_LEFT_FOLLOWER_CAN,can_left}
              arm_type: yam
              gripper_type: flexible_4310
              gripper_limits: null
              enable_auto_recovery: true
              gravity_comp_factor: [1.3, 1.3, 1.3, 1.3, 1.0, 1.0]
              use_coulomb_friction: true
            right_follower:
              ee_mass: null
              channel: ${oc.env:YAM_RIGHT_FOLLOWER_CAN,can_right}
              arm_type: yam
              gripper_type: flexible_4310
              gripper_limits: null
              enable_auto_recovery: true
              gravity_comp_factor: [1.3, 1.3, 1.3, 1.3, 1.0, 1.0]
              use_coulomb_friction: true
            # Structurally required by DualYamConfig, never connected in VR mode.
            left_leader:
              ee_mass: null
              channel: ${oc.env:YAM_LEFT_LEADER_CAN,can_lead_l}
              gripper_type: yam_teaching_handle
              gripper_limits: [0.0, 1.0]
            right_leader:
              ee_mass: null
              channel: ${oc.env:YAM_RIGHT_LEADER_CAN,can_lead_r}
              gripper_type: yam_teaching_handle
              gripper_limits: [0.0, 1.0]
            cameras:
              - name: top_rgb
                serial: ${oc.env:YAM_TOP_CAMERA_SERIAL}
                camera_type: realsense
                resolution: [640, 480]
                fps: 30
              - name: left_rgb
                serial: ${oc.env:YAM_LEFT_CAMERA_SERIAL}
                camera_type: realsense
                resolution: [640, 480]
                fps: 30
              - name: right_rgb
                serial: ${oc.env:YAM_RIGHT_CAMERA_SERIAL}
                camera_type: realsense
                resolution: [640, 480]
                fps: 30

runner:
  task_type: embodied
  logger:
    log_path: null
    project_name: rlinf
    experiment_name: dual-yam-pico-collection
    logger_backends: [tensorboard]
  num_data_episodes: 50
  record_task_description: true
  # LeRobot streaming collection below already persists every frame; skip the
  # RLinf demo replay buffer, which would hold each episode's raw images in
  # memory a second time.
  save_demos: false

seed: 1234

env:
  group_name: EnvGroup
  eval:
    max_episode_steps: 10000
    max_steps_per_rollout_epoch: 10000
    auto_reset: false
    ignore_terminations: false
    teleop: yam_pico
    pico:
      hand: dual
      zmq_addr: ${oc.env:YAM_PICO_ZMQ_ADDR,ipc:///tmp/vr_data.ipc}
      position_scale: 0.65
      rotation_scale: 0.65
      # Rotate about the same calibrated operator axes used for translation.
      rotation_delta_frame: operator
      control_threshold: 0.85
      max_stale_s: 0.2
      max_position_delta: 0.005
      max_rotation_delta: 0.03
      # Post-compute rejection limits, not hard real-time deadlines.
      max_tick_s: 0.1
      # On geometric IK failure, retry 1/2, 1/4, then 1/8 of the TCP delta.
      # All attempts for one arm share ik.max_solve_s (checked on return).
      ik_backtrack_attempts: 3
      wait_for_record_button: true
      log_control_timing: true
      record_button: right_menu_button
      discard_button: left_menu_button
      button_debounce_s: 0.2
      keyboard_enabled: false
      left:
        operator_to_robot_yaw: 0.0
      right:
        operator_to_robot_yaw: 0.0
      ik:
        site_name: grasp_site
        solver: quadprog
        max_iters: 30
        dt: 0.01
        position_tolerance: 0.001
        rotation_tolerance: 0.01
        max_solve_s: 0.03
    override_cfg:
      enforce_runtime_joint_limits: true
      max_joint_delta: 0.08
      # J1..J6, radians per command; shared by both arms.
      max_joint_delta_per_joint: [0.3, 0.3, 0.3, 0.3, 0.3, 0.3]
      step_frequency: 30.0
      manual_episode_control_only: true
      reset:
        enabled: false
      # Drive both arms to the folded resting pose before torque-off so
      # closing the session never drops them.
      park_on_close:
        enabled: true
        left_qpos: [-0.0032, 0.0063, 0.0055, -0.0685, 0.0086, -0.0147, 1.0]
        right_qpos: [0.0216, 0.0071, 0.0078, -0.0795, -0.0261, 0.0971, 1.0]
        duration_s: 6.0
        max_joint_delta: 0.02
        tolerance: 0.05
        timeout_s: 40.0
      leader_intervention:
        enabled: false
    data_collection:
      enabled: true
      save_dir: ${runner.logger.log_path}/collected_data
      export_format: lerobot
      # Streaming writes every recorded frame straight to disk (flat memory on
      # the 16 GB Mini PC); successful and failed episodes are both saved with
      # the episode-level is_success flag stamped at episode end.
      streaming: true
      only_success: false
      robot_type: dual_yam
      fps: 30
      finalize_interval: 10
